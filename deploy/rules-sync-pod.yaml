# 009 US3: short-lived helper pod that mounts the honkai-rule-server PVC so
# `kubectl cp` (or `kubectl exec | tar -x`) can land local custom-rules
# files in /data/custom-rules/ on the PVC. The application's runtime image
# is `FROM scratch` (no shell), so it cannot host the cp itself.
#
# Lifecycle (managed by `make rules-sync`):
#   1. kubectl apply -f deploy/rules-sync-pod.yaml
#   2. kubectl wait --for=condition=Ready pod/honkai-rule-server-rules-sync
#   3. kubectl exec ... rm -rf /data/custom-rules/*
#   4. tar -cf - config/custom-rules/. | kubectl exec -i ... tar -xf -
#   5. kubectl delete pod honkai-rule-server-rules-sync
#
# The pod is intentionally short-lived. Do not leave it running.
apiVersion: v1
kind: Pod
metadata:
  name: honkai-rules-sync
  labels:
    app.kubernetes.io/name: honkai-rule-server
    app.kubernetes.io/component: rules-sync
spec:
  restartPolicy: Never
  containers:
    - name: sync
      image: busybox:1.36
      command: ["sleep", "3600"]   # idle long enough for the cp; Makefile deletes on completion
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: data
      persistentVolumeClaim:
        # NOTE: matches the chart's PVC name. The chart renders the PVC as
        # `{{ .Release.Name }}-data`. With release name `honkai-rule-server`
        # the resulting PVC is `honkai-rule-server-data`.
        # Override via PVC_NAME=... if your release name differs.
        claimName: honkai-rule-server-data
