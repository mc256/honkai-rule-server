# 009 US3: short-lived helper pod that mounts the honkai-rule-server PVC so
# `kubectl cp` (or `kubectl exec | tar -x`) can land local custom-rules
# files in /data/custom-rules/ on the PVC. The application's runtime image
# is `FROM scratch` (no shell), so it cannot host the cp itself.
#
# This file is a TEMPLATE — the Makefile (`rules-sync` and `cache-clear`
# targets) substitutes the `__RULES_SYNC_POD__` and `__PVC_NAME__` tokens
# with the values of the matching Make variables before piping to
# `kubectl apply -f -`. Do not `kubectl apply` this file directly; the
# placeholders are not valid Kubernetes identifiers.
#
# Lifecycle (managed by `make rules-sync`):
#   1. sed-substitute placeholders, kubectl apply -f -
#   2. kubectl wait --for=condition=Ready pod/$(RULES_SYNC_POD)
#   3. kubectl exec ... rm -rf /data/custom-rules/*
#   4. tar -cf - config/custom-rules/. | kubectl exec -i ... tar -xf -
#   5. kubectl delete pod $(RULES_SYNC_POD)
#
# The pod is intentionally short-lived. Do not leave it running.
apiVersion: v1
kind: Pod
metadata:
  # __RULES_SYNC_POD__ is replaced by Makefile variable RULES_SYNC_POD
  # (default: honkai-rules-sync). Override per cluster as needed.
  name: __RULES_SYNC_POD__
  labels:
    app.kubernetes.io/name: honkai-rule-server
    app.kubernetes.io/component: rules-sync
spec:
  restartPolicy: Never
  containers:
    - name: sync
      image: busybox:1.36
      command: ["sleep", "3600"]   # idle long enough for the cp; Makefile deletes on completion
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: "10m"
          memory: "16Mi"
        limits:
          cpu: "100m"
          memory: "64Mi"
  volumes:
    - name: data
      persistentVolumeClaim:
        # __PVC_NAME__ is replaced by Makefile variable PVC_NAME
        # (default: honkai-rule-server-data, matching the chart's
        # `{{ .Release.Name }}-data` PVC for a release named
        # `honkai-rule-server`). For deployments under different release
        # names — where the rendered PVC has a different name (e.g.,
        # `<release>-honkai-data`) — set PVC_NAME=<...> when invoking make.
        claimName: __PVC_NAME__
