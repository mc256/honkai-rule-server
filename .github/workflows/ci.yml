name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    name: vet + staticcheck + test (-race) + snapshot drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: go test -race
        run: go test -race ./...

      - name: snapshot drift check
        # If a developer changed merge/output/templates without
        # regenerating snapshots, `git diff` shows a diff and we fail.
        run: git diff --exit-code

  build-image:
    name: docker build (smoke)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: docker build
        run: docker build --tag honkai-rule-server:ci .

  # 013: publish a master-tagged + sha-tagged image to GHCR on every direct
  # master push. Gated on the existing `test` job so a failing test suite
  # blocks publication. Does NOT run on PRs (see contracts/ghcr-tag-contract.md
  # Trigger A vs Trigger B).
  publish-master:
    name: publish image to GHCR (master only)
    needs: test
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/honkai-rule-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=honkai-rule-server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=master
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
