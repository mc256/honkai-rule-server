name: release

# Triggers on tag pushes matching vMAJOR.MINOR.PATCH (with optional pre-release suffix).
# Non-matching tags (e.g., demo-2026, vfoo) are ignored. See
# specs/013-ci-container-release/contracts/ghcr-tag-contract.md.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write   # action-gh-release creates the GitHub Release entry
  packages: write   # docker/build-push-action pushes to GHCR

jobs:
  test:
    name: vet + staticcheck + test (-race) + snapshot drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: go vet
        run: go vet ./...

      - name: staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...

      - name: go test -race
        run: go test -race ./...

      - name: snapshot drift check
        run: git diff --exit-code

  build-and-push:
    name: build + push image to GHCR
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/honkai-rule-server
          # latest=auto: advance :latest only when this is the highest-precedence
          # non-pre-release tag in the repo (handles hotfix-vs-latest per FR-010).
          # prefix=v,onlatest=false: prepend v to all semver tags (vX.Y.Z, vX.Y,
          # vX) per spec convention; leave :latest unprefixed. Earlier attempt
          # used `pattern=v{{version}}` literal but metadata-action normalizes
          # semver patterns and strips literal v prefixes — `flavor: prefix=v`
          # is the canonical way.
          flavor: |
            latest=auto
            prefix=v,onlatest=false
          # type=semver patterns automatically suppress moving tags for pre-release
          # tags (e.g., v1.5.0-rc.1 emits only itself, not :v1.5 / :v1 / :latest).
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=honkai-rule-server
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: create GitHub Release entry
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history for auto-generated release notes

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Pre-release tags (those with a hyphen after the version) are flagged
          # so the GitHub UI's "Latest release" badge tracks the highest stable.
          prerelease: ${{ contains(github.ref_name, '-') }}
